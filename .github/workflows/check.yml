name: Restock check

on:
  schedule:
    # every 30 minutes. GitHub queues scheduled jobs, so real spacing is
    # usually 30-45 min. Keeping it here (not tighter) stays inside the
    # 2000 free Actions minutes/month that private repos get.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a check by hand from the Actions tab

# only one check at a time - two runs committing stock.json would collide
concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the updated stock.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one sweep
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python checker.py --once

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || git commit -m "stock update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
