name: Restock check

on:
  schedule:
    # Every 30 minutes - the only interval actually proven to fire on this repo.
    #
    # Don't lower this without testing. */10 was tried on 2026-09-09 and
    # GitHub's scheduler silently dropped every single run (two hours, zero
    # firings) while */30 had been firing reliably. GitHub throttles
    # high-frequency crons hard and drops them rather than delaying them.
    # Genuinely faster checks need a VPS cron, not GitHub Actions.
    #
    # Separately: if run logs show "check failed (HTTP Error 403)", that's the
    # retailers rate-limiting us, and the fix is also a longer interval.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a check by hand from the Actions tab

# only one check at a time - two runs committing stock.json would collide
concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the updated stock.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one sweep
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # #ps5 channel
          DISCORD_WEBHOOK_GPU: ${{ secrets.DISCORD_WEBHOOK_GPU }}   # #gpus channel
        run: python checker.py --once

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.json status_message.json
          git diff --staged --quiet || git commit -m "stock update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
