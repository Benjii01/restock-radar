name: Restock check

on:
  schedule:
    # Stays at every 30 minutes because that is the only interval GitHub's
    # scheduler reliably fires on this repo. The *check* cadence is no longer
    # tied to it: each run now sweeps repeatedly for ~29 minutes (see the
    # --for/--every flags below), so checks land every minute while only
    # asking cron for something it will honour.
    #
    # Don't lower this. */10 was tried on 2026-09-09 and GitHub silently
    # dropped every single run (two hours, zero firings) while */30 fired
    # reliably. GitHub throttles high-frequency crons by dropping them.
    #
    # NOTE: a long-running job like this only makes sense on a PUBLIC repo,
    # where Actions minutes are unlimited. While the repo is private the free
    # 2,000 min/month cap is blown in about two days.
    #
    # If run logs show "check failed (HTTP Error 403)", that's the retailers
    # rate-limiting us - raise --every rather than lowering it.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a check by hand from the Actions tab

# only one check at a time - two runs committing stock.json would collide
concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Each run sweeps for 29 minutes, deliberately running into the next
    # :00/:30 start - the concurrency group above queues that run and starts
    # it the moment this one finishes, so checking is continuous apart from
    # the minute a new run takes to set up. 25 minutes (the old length) left
    # ~7 unchecked minutes every half hour, 12% of the day (measured
    # 2026-09-27). The timeout is only a backstop for a hung sweep.
    timeout-minutes: 34
    permissions:
      contents: write       # needed to commit the updated stock.json
    steps:
      # ref: main, not the default of the commit that triggered the run. A run
      # queued behind another (concurrency, above) would otherwise start from
      # the files as they were when it was queued, missing the stock.json and
      # status_message.json the previous run just committed - so it re-alerts
      # on old stock and posts a duplicate status message (2026-09-26).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep every minute (Best Buy every 15 s) until the next run is due
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PS5_STATUS: ${{ secrets.DISCORD_WEBHOOK_PS5_STATUS }}  # optional; unset = status stays in the alert channel
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}             # optional; phone alarm on restock
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}                   # optional; watchdog that alerts when checks stop
          DISCORD_PING: ${{ secrets.DISCORD_PING }}                 # optional; unset = @everyone
        run: python checker.py --for 29 --every 60 --quick 15

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet stock.json status_message.json && exit 0
          # These two files are regenerated in full every sweep, so there is
          # never anything to merge - the freshest copy simply wins. Rebasing
          # them was wrong: when two runs touch the same generated file git
          # stops mid-rebase with a conflict, and every later attempt then
          # dies on "unmerged files". So: hold the fresh copies aside, take
          # whatever is on origin, put them back, commit that.
          mkdir -p "$RUNNER_TEMP/out"
          cp stock.json status_message.json "$RUNNER_TEMP/out/"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/out/stock.json" "$RUNNER_TEMP/out/status_message.json" .
            git add stock.json status_message.json
            git diff --staged --quiet && exit 0
            git commit -q -m "stock update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q && exit 0
            echo "push attempt $attempt lost the race - refetching and retrying"
            sleep 5
          done
          echo "could not push the stock update after 3 attempts"
          exit 1
