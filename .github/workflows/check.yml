name: Restock check

on:
  schedule:
    # Every 10 minutes. Free because the repo is public; a private repo would
    # blow past the 2000 min/month tier at this rate. GitHub queues scheduled
    # jobs under load, so real spacing runs a few minutes longer than this.
    # If run logs start showing "check failed (HTTP Error 403)", the retailers
    # are rate-limiting us - raise this interval.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # lets you trigger a check by hand from the Actions tab

# only one check at a time - two runs committing stock.json would collide
concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the updated stock.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one sweep
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # #ps5 channel
          DISCORD_WEBHOOK_GPU: ${{ secrets.DISCORD_WEBHOOK_GPU }}   # #gpus channel
        run: python checker.py --once

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.json status_message.json
          git diff --staged --quiet || git commit -m "stock update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
